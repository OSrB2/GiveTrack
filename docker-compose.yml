services:
  postgres:
    image: postgres:17-alpine
    container_name: givetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - givetrack_data:/var/lib/postgresql/data

volumes:
  givetrack_data:
